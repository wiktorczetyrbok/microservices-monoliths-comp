syntax = "proto3";

package similarity;

option java_multiple_files = true;
option java_package = "pb.java.microservices.grpc.similarity.generatedProto";

service Similarity {
  rpc Find (SimilarityRequest) returns (SimilarityResponse);
}

message SimilarityRequest {
  repeated float queryVector = 1;
  float threshold = 2;
}

message SimilarityResponse {
  repeated string imageIds = 1;
}
