syntax = "proto3";

option java_multiple_files = true;
option java_package = "pb.java.microservices.grpc.feature.generatedProto";

package feature;

service Feature {
  rpc Extract (FeatureRequest) returns (FeatureResponse);
}

message FeatureRequest {
  string imageId = 1;
  int32 kernel = 2;
}

message FeatureResponse {
  repeated float vector = 1;
}
